# cluster-template-home.yaml
kind: Cluster
name: erauner-home                       # Cluster name in Omni
talos:
  version: v1.14.5               # Rolling upgrade; workers held individually until verified
kubernetes:
  version: 1.35.8                # Substrate certificate API prerequisite; Cilium 1.19.7 supports this minor
features:
  enableWorkloadProxy: true      # SaaS Omni feature – leave on
patches:
  - name: cluster-base
    file: ./patches/cluster.yaml   # relative path because repo will be synced
  - name: cilium-install-home
    file: ./patches/cilium-install-home.yaml
  - name: longhorn-install-home
    file: ./patches/longhorn-install-home.yaml
  - name: longhorn-configure-home
    file: ./patches/longhorn-configure-home.yaml
  - name: substrate-certificates-home
    file: ./patches/substrate-certificates-home.yaml

---
kind: ControlPlane
machines:
  - e58acc82-cc4c-d949-b369-bc3898683580   # Beelink CP
patches:
  - name: controlplane-base
    file: ./patches/controlplane.yaml
  - name: machine-hostdns         # comment out if you dropped the file
    file: ./patches/machine-hostdns.yaml
  - name: kubelet
    file: ./patches/machine-kubelet.yaml
  - name: kernel-storage
    file: ./patches/kernel-iscsi.yaml
  - name: machine-registries
    file: ./patches/machine-registries.yaml
  - name: spegel-containerd
    file: ./patches/spegel-containerd.yaml
  # 🛑 DO NOT inject the "bgp=enable" label here—only Workers run the BGP speaker!
  # ✅ Add control-plane taint to prevent regular workloads from scheduling here.
  # The 4-core Beelink is undersized compared to 16-core workers - keep it for
  # kube-apiserver, etcd, controller-manager, scheduler, and CNI only.
  # Added: 2026-01-21 after NodeSystemSaturation alert (load 14.5 on 4 cores)
  - name: controlplane-taint
    inline:
      machine:
        kubelet:
          extraArgs:
            register-with-taints: node-role.kubernetes.io/control-plane:NoSchedule
  - name: static-ip
    inline:
      machine:
        network:
          interfaces:
            - deviceSelector:          # ⬅️  change
                hardwareAddr: e8:ff:1e:dd:18:63   # CP MAC
              dhcp: false
              addresses: [192.168.1.193/24]    # << static for controlplane1
              routes:
                - network: 0.0.0.0/0
                  gateway: 192.168.1.1
          nameservers:
            - 192.168.1.1
        sysctls:
          net.ipv4.conf.all.rp_filter: "0"
          net.ipv4.conf.default.rp_filter: "0"
          net.ipv4.conf.enp1s0.rp_filter: "0"
          # net.ipv4.conf.cilium_host.rp_filter: "0"
  - name: service-account-discovery-home
    file: ./patches/service-account-discovery-home.yaml
  - name: home-maintenance-logging
    file: ./patches/home-maintenance-logging.yaml
  - name: firmware-reboots
    file: ./patches/home-firmware-reboots.yaml
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/btrfs
---
kind: Workers
name: workers
machines:
  - 30467aa4-b8a4-2e43-8591-a8595f97a43c   # worker1
  - d3945f76-fb6b-c244-9ca3-a8595f9b4f7e   # worker3
kernelArgs:
  # Pre-stage the mask in the CPU image before the first GPU-enabled boot.
  - amdgpu.ppfeaturemask=0xfff73fff
patches:
  - name: worker-base
    file: ./patches/worker.yaml
  - name: machine-hostdns         # comment out if you dropped it
    file: ./patches/machine-hostdns.yaml
  - name: kubelet
    file: ./patches/machine-kubelet.yaml
  - name: kernel-storage
    file: ./patches/kernel-iscsi.yaml
  - name: machine-registries
    file: ./patches/machine-registries.yaml
  - name: spegel-containerd
    file: ./patches/spegel-containerd.yaml
  # ✅ Correct: inject the "bgp=enable" node label only on worker nodes (eligible for BGP speaking).
  - name: node-labels
    inline:
      machine:
        kubelet:
          extraArgs:
            "node-labels": "bgp=enable"
        nodeLabels:
          # Explicit false replaces the existing label and excludes these nodes
          # from the GPU operator's amd.com/gpu=true selector.
          amd.com/gpu: "false"
  - name: gvisor-userns-workers
    file: ./patches/gvisor-userns-workers.yaml
  - name: home-maintenance-logging
    file: ./patches/home-maintenance-logging.yaml
  - name: firmware-reboots
    file: ./patches/home-firmware-reboots.yaml
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/btrfs
  # CPU-only staging: verify firmware reboot control before adding each GPU.
  - siderolabs/amd-ucode
  - siderolabs/realtek-firmware

---
# worker2 is intentionally isolated from the shared worker machine set.
#
# Incident 2026-07-12: this node repeatedly hard-froze shortly after the
# siderolabs/amdgpu extension initialized. A minimal Talos image containing
# amd-ucode and realtek-firmware, but no amdgpu, remained stable and the node
# subsequently rejoined Kubernetes on the CPU-only schematic. Keep both the
# amdgpu extension and patches/kernel-amdgpu.yaml out of the normal baseline.
# The 2026-09-07 driver-only canary became unreachable shortly after boot.
# The 2026-10-26 retry also lost network/API contact on Talos 1.13.12.
# Isolated GFXOFF canary: retain recovery isolation and exclude GPU workloads.
# Linux passed a 30-minute idle comparison; Talos stability is still unproven.
#
# The Realtek firmware is also intentional: both RTL8168h/8111h adapters logged
# missing rtl_nic/rtl8168h-2.fw without it. Keep this firmware in the test image.
kind: Workers
name: worker2
machines:
  - 4913bb46-7cd8-2048-84c7-a8595f97a48c
patches:
  - name: worker-base
    file: ./patches/worker.yaml
  - name: machine-hostdns
    file: ./patches/machine-hostdns.yaml
  - name: kubelet
    file: ./patches/machine-kubelet.yaml
  - name: kernel-storage
    file: ./patches/kernel-iscsi.yaml
  - name: machine-registries
    file: ./patches/machine-registries.yaml
  - name: spegel-containerd
    file: ./patches/spegel-containerd.yaml
  - name: node-labels
    inline:
      machine:
        kubelet:
          extraArgs:
            "node-labels": "bgp=enable"
        nodeLabels:
          # Driver-only test: exclude both AMD DeviceConfig selectors.
          amd.com/gpu: "false"
  - name: kernel-amdgpu-no-gfxoff
    file: ./patches/kernel-amdgpu-no-gfxoff.yaml
systemExtensions:
  - siderolabs/iscsi-tools
  - siderolabs/util-linux-tools
  - siderolabs/btrfs
  - siderolabs/amd-ucode
  - siderolabs/amdgpu
  - siderolabs/realtek-firmware

#######################################################################
# ─── PER-NODE HOSTNAME + STATIC IP PATCHES ──────────────────────────
#######################################################################
---
kind: Machine                           # controlplane1 (already active)
name: e58acc82-cc4c-d949-b369-bc3898683580
patches:
  - name: set-nodename
    inline:
      machine:
        network:
          hostname: "controlplane1"
          interfaces:
            - deviceSelector:
                hardwareAddr: e8:ff:1e:dd:18:63
              dhcp: false
              addresses: [192.168.1.193/24]
              routes:
                - network: 0.0.0.0/0
                  gateway: 192.168.1.1
          nameservers: [192.168.1.1]
        sysctls:
          net.ipv4.conf.all.rp_filter: "0"
          net.ipv4.conf.default.rp_filter: "0"
          net.ipv4.conf.enp1s0.rp_filter: "0"
          # net.ipv4.conf.cilium_host.rp_filter: "0"

---
kind: Machine                           # worker1  → 192.168.1.194
name: 30467aa4-b8a4-2e43-8591-a8595f97a43c
locked: true                            # Hold singleton workloads during the first upgrade stage
patches:
  - name: set-nodename
    inline:
      machine:
        network:
          hostname: "worker1"
          interfaces:
            - deviceSelector:
                hardwareAddr: b0:41:6f:16:5e:66
              dhcp: false
              addresses: [192.168.1.194/24]
              routes:
                - network: 0.0.0.0/0
                  gateway: 192.168.1.1
          nameservers: [192.168.1.1]
        sysctls:
          net.ipv4.conf.all.rp_filter: "0"
          net.ipv4.conf.default.rp_filter: "0"
          net.ipv4.conf.enp1s0.rp_filter: "0"
          # net.ipv4.conf.cilium_host.rp_filter: "0"

---
kind: Machine                           # worker2  → 192.168.1.195
name: 4913bb46-7cd8-2048-84c7-a8595f97a48c
locked: true # Hold the GPU canary while the control plane is upgraded first.
# Apply before any early driver auto-load, as well as the module configuration.
kernelArgs:
  - amdgpu.ppfeaturemask=0xfff73fff
patches:
  - name: gvisor-userns-worker2
    file: ./patches/gvisor-userns-workers.yaml
  - name: set-nodename
    inline:
      machine:
        network:
          hostname: "worker2"
          interfaces:
            - deviceSelector:
                hardwareAddr: b0:41:6f:16:a2:3e
              dhcp: false
              addresses: [192.168.1.195/24]
              routes:
                - network: 0.0.0.0/0
                  gateway: 192.168.1.1
          nameservers: [192.168.1.1]
        sysctls:
          net.ipv4.conf.all.rp_filter: "0"
          net.ipv4.conf.default.rp_filter: "0"
          net.ipv4.conf.enp1s0.rp_filter: "0"
          # net.ipv4.conf.cilium_host.rp_filter: "0"

  - name: worker2-crash-logging
    file: ./patches/worker2-crash-logging.yaml
  - name: recovery-isolation
    inline:
      machine:
        kubelet:
          extraArgs:
            register-with-taints: homelab.dev/recovery=cpu-only:NoSchedule
  - name: firmware-reboots
    inline:
      machine:
        sysctls:
          # Test the reboot-path hypothesis before another GPU image rollout.
          kernel.kexec_load_disabled: "1"

---
kind: Machine                           # worker3  → 192.168.1.196
name: d3945f76-fb6b-c244-9ca3-a8595f9b4f7e
locked: true                            # Hold singleton workloads during the first upgrade stage
patches:
  - name: set-nodename
    inline:
      machine:
        network:
          hostname: "worker3"
          interfaces:
            - deviceSelector:
                hardwareAddr: b0:41:6f:16:a3:00
              dhcp: false
              addresses: [192.168.1.196/24]
              routes:
                - network: 0.0.0.0/0
                  gateway: 192.168.1.1
          nameservers: [192.168.1.1]
        sysctls:
          net.ipv4.conf.all.rp_filter: "0"
          net.ipv4.conf.default.rp_filter: "0"
          net.ipv4.conf.enp1s0.rp_filter: "0"
          # net.ipv4.conf.cilium_host.rp_filter: "0"
